# AkameGuard Phase 5 configuration.
# Runtime protection defaults to monitor-only and remains opt-in for block mode.

project_name: AkameGuard
phase: 5

scanner:
  enabled: true
  max_file_size_bytes: 2097152
  rules:
    - rules/php_rules.json
    - rules/node_rules.json
  extra_rule_paths: []

monitor:
  enabled: false
  interval_seconds: 5

paths:
  include:
    - .
  ignore_folders:
    - .git
    - node_modules
    - vendor
    - private_testing
    - akameguard_testkit
  # Script-like files under these folders get PATH-UPLOADS-SCRIPT.
  # This replaces the default list; generic media and files are not included.
  uploads_folder_names:
    - upload
    - uploads
    - uploaded
    - user-upload
    - user-uploads
    - user_uploads
    - useruploads
    - file-upload
    - file-uploads
    - file_uploads
    - attachments

runtime:
  php: runtime/php/akameguard.php
  node: runtime/node/akameguard.js
  config: runtime/config.json
  rules: runtime/rules.json

reporting:
  output: stdout

integrity:
  # Leave empty to use a baseline.json outside the scanned folder by default.
  baseline_file: ""
