[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "akameguard"
version = "0.1.0"
description = "Beginner-friendly read-only PHP and Node.js web shell detection and hardening toolkit"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
keywords = ["web shell", "detection", "early warning", "php", "node.js", "integrity monitoring", "security"]
authors = [
  { name = "AkameGuard contributors" },
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Security",
]

[project.urls]
Homepage = "https://github.com/professordoom58-art/AkameGuard"
Repository = "https://github.com/professordoom58-art/AkameGuard"
Issues = "https://github.com/professordoom58-art/AkameGuard/issues"

[project.scripts]
akameguard = "akameguard.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["akameguard*"]
